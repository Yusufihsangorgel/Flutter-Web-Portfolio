[build]
  command = "bash tool/hosted_build.sh"
  publish = "build/web"

[build.environment]
  NODE_VERSION = "24.18.0"

# portfolio-security:start
[[headers]]
  for = "/*"
  [headers.values]
  Strict-Transport-Security = "max-age=31536000"
  Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' https://analytics.developeryusuf.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://analytics.developeryusuf.com; frame-ancestors 'self'; upgrade-insecure-requests;"
# portfolio-security:end
