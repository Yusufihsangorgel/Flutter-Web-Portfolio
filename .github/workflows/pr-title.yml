name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate pull request title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9/-]+\))?!?: .{1,72}$'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            exit 0
          fi
          printf 'Required pattern: %s\nOffending title: %s\n' "$pattern" "$PR_TITLE" >&2
          exit 1
