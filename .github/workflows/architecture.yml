name: Architecture gate

# Check import boundaries on hosted runners.
on:
  pull_request:
    paths:
      - "lib/**"
      - "quality/**"
      - "docs/ARCHITECTURE-RULES.md"
      - ".github/workflows/architecture.yml"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "quality/**"
      - "docs/ARCHITECTURE-RULES.md"
      - ".github/workflows/architecture.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Architecture gate calibration
        run: python3 -m unittest discover -s quality/tests -p 'test_architecture.py'

      - name: Architecture import rules
        run: python3 quality/check_architecture.py
