name: Refresh portfolio data

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: refresh-portfolio-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # The first run of each month also refreshes download counters.
      - name: Fetch live pub.dev and GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          counters=()
          if [ "$(date -u +%d)" -le 7 ]; then counters=(--counters); fi
          node tool/refresh_portfolio_data.mjs --report "${RUNNER_TEMP}/refresh-report.md" "${counters[@]}"

      - name: Publish the refresh report to the job summary
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/refresh-report.md" ]; then
            cat "${RUNNER_TEMP}/refresh-report.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - id: content-diff
        name: Check whether the canonical content changed
        run: |
          if [ -n "$(git status --porcelain -- assets/content/portfolio.json)" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - id: toolchain
        if: steps.content-diff.outputs.changed == 'true'
        name: Read the pinned Flutter version
        run: |
          flutter_version="$(node -e "console.log(require('./tool/toolchain.json').flutter)")"
          echo "flutter=${flutter_version}" >> "${GITHUB_OUTPUT}"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.content-diff.outputs.changed == 'true'
        with:
          flutter-version: ${{ steps.toolchain.outputs.flutter }}
          cache: true

      - name: Install the build toolchain
        if: steps.content-diff.outputs.changed == 'true'
        run: |
          node tool/verify_toolchain.mjs --current
          flutter pub get
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify the refreshed content
        if: steps.content-diff.outputs.changed == 'true'
        run: |
          npm run test:template
          npm run test:release-security
          npm run test:refresh
          npm run test:content
          npm run audit:sources
          npm run audit:history
          npm run typecheck
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze --fatal-infos
          flutter test

      - name: Sync derived public content
        if: steps.content-diff.outputs.changed == 'true'
        run: npm run sync:content

      # New text from the refreshed record must not silently fall back to another font.
      - name: Subset the Latin fonts to the refreshed glyph set
        if: steps.content-diff.outputs.changed == 'true'
        run: |
          npm run fonts:subset
          npm run verify:fonts

      # Hosted builds verify the committed social card instead of rendering it.
      - name: Render the social card and source manifest
        if: steps.content-diff.outputs.changed == 'true'
        run: npm run prepare:source

      - name: Stage the refreshed content
        if: steps.content-diff.outputs.changed == 'true'
        # Reject changes outside the refreshed source and derived content.
        run: |
          git add -- \
            assets/content/portfolio.json \
            README.md \
            CODE_OF_CONDUCT.md \
            SECURITY.md \
            web/index.html \
            web/robots.txt \
            web/sitemap.xml \
            web/llms.txt \
            web/manifest.json \
            web/_headers \
            web/assets/og \
            nginx/default.conf \
            firebase.json \
            vercel.json \
            package.json \
            assets/fonts \
            assets/build/source_manifest.sha256
          leftover="$(git diff --name-only; git ls-files --others --exclude-standard)"
          if [ -n "${leftover}" ]; then
            echo "Unstaged changes after staging the refresh:" >&2
            echo "${leftover}" >&2
            exit 1
          fi

      - id: branch
        name: Commit and push the refresh branch
        if: steps.content-diff.outputs.changed == 'true'
        run: |
          branch="bot/refresh-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git switch -c "${branch}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(data): refresh portfolio record from pub.dev and GitHub'
          git push origin "${branch}"
          {
            echo "name=${branch}"
            echo "head_sha=$(git rev-parse HEAD)"
            echo "base_sha=$(git rev-parse HEAD^)"
          } >> "${GITHUB_OUTPUT}"

      - name: Open a pull request and verify its branch
        if: steps.content-diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
          BASE_SHA: ${{ steps.branch.outputs.base_sha }}
        run: |
          pr_url="$(gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title 'chore(data): refresh portfolio record from pub.dev and GitHub' \
            --body-file "${RUNNER_TEMP}/refresh-report.md")"
          gh workflow run ci.yml --ref "${BRANCH}"

          run_id=''
          for attempt in {1..30}; do
            run_id="$(gh run list \
              --workflow ci.yml \
              --branch "${BRANCH}" \
              --event workflow_dispatch \
              --json databaseId,headSha \
              --limit 20 \
              --jq ".[] | select(.headSha == \"${HEAD_SHA}\") | .databaseId" | head -n 1)"
            if [ -n "${run_id}" ]; then break; fi
            sleep 10
          done
          if [ -z "${run_id}" ]; then
            echo "CI run did not appear after ${attempt} checks for ${BRANCH}; leaving ${pr_url} open." >&2
            exit 1
          fi
          if ! timeout 3600 gh run watch "${run_id}" --exit-status --interval 15; then
            echo "CI failed or timed out for ${BRANCH}; leaving ${pr_url} open." >&2
            exit 1
          fi

          main_sha="$(git ls-remote origin refs/heads/main | cut -f 1)"
          if [ "${main_sha}" != "${BASE_SHA}" ]; then
            echo "Main advanced during CI; leaving ${pr_url} open for a new run." >&2
            exit 1
          fi
          gh pr merge "${pr_url}" --squash --delete-branch --match-head-commit "${HEAD_SHA}"
          gh workflow run ci.yml --ref main
