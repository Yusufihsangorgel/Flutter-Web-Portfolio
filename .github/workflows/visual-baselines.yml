name: Visual baselines

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          cache: true
      - run: node tool/quality/verify_toolchain.mjs --current
      - run: flutter clean
      - run: flutter pub get
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:content
      - run: npm run prepare:source
      - run: flutter build web --release --wasm --no-web-resources-cdn
      - run: npm run prepare:bundle
      - run: npm run verify:bundle
      - run: npx playwright test tests/e2e/visual.spec.ts --update-snapshots=all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: visual-baselines
          path: tests/e2e/visual.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 7
