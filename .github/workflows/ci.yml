name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow the data refresh workflow to start CI.
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: npm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          cache: true
      - run: node tool/verify_toolchain.mjs --current
      - run: flutter pub get
      - run: npm ci
      - run: npm run verify:content
      - run: npm run portfolio:validate
      - run: npm run test:template
      - run: npm run test:release-security
      - run: npm run test:refresh
      - run: npm run test:content
      - run: npm run verify:hosting
      - run: npm run verify:community
      - run: npm run audit:sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run audit:history
      - run: npm run typecheck
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: bash -n tool/hosted_build.sh
      - name: Check tool syntax
        run: |
          find tool -type f -name '*.mjs' -print0 |
            while IFS= read -r -d '' file; do
              node --check "$file" || exit 1
            done
      - run: node tool/test_coverage_gate.mjs
      - run: flutter analyze --fatal-infos
      - run: npm run verify:source

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: npm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          cache: true
      - run: node tool/verify_toolchain.mjs --current
      - run: flutter pub get
      - run: flutter test --coverage
      - run: node tool/coverage_gate.mjs
      - run: flutter pub get
        working-directory: packages/adaptive_render_budget
      - run: flutter test
        working-directory: packages/adaptive_render_budget

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: npm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          cache: true
      - run: node tool/verify_toolchain.mjs --current
      - run: flutter clean
      - run: flutter pub get
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:content
      - run: npm run prepare:source
      - run: flutter build web --release --wasm --no-web-resources-cdn
      - run: npm run prepare:bundle
      - run: npm run verify:bundle
      - run: docker build --tag flutter-web-portfolio:ci .
      - run: npm run test:clone
      - run: npm test
      - run: npm run verify:runtime
      - name: Package verified release
        run: |
          tar --sort=name --mtime='UTC 2000-01-01' --owner=0 --group=0 --numeric-owner -C build -cf - web | gzip -n -9 > web-release.tar.gz
          sha256sum web-release.tar.gz > web-release.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-release
          path: |
            web-release.tar.gz
            web-release.sha256
          if-no-files-found: error
          retention-days: 30

  attest:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name web-release --dir .
      - run: sha256sum --check web-release.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: web-release.tar.gz
