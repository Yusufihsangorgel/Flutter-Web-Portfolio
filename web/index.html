  <style>
    @font-face {
      font-family: "Space Grotesk Critical";
      src: url("assets/assets/fonts/space_grotesk/SpaceGrotesk-Variable.ttf") format("truetype");
      font-display: optional;
      font-style: normal;
      font-weight: 300 700;
    }
    @font-face {
      font-family: "Noto Sans Arabic Critical";
      src: url("assets/assets/fonts/noto_sans_arabic/NotoSansArabic-Variable.ttf") format("truetype");
      font-display: optional;
      font-style: normal;
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Noto Sans Devanagari Critical";
      src: url("assets/assets/fonts/noto_sans_devanagari/NotoSansDevanagari-Variable.ttf") format("truetype");
      font-display: optional;
      font-style: normal;
      font-weight: 100 900;
    }
    :root {
      --bootstrap-sans: "Space Grotesk Critical", ui-sans-serif, sans-serif;
      color-scheme: light;
      background: #f2eee5;
    }
    html[lang="ar"] {
      --bootstrap-sans: "Noto Sans Arabic Critical", "Space Grotesk Critical", ui-sans-serif, sans-serif;
    }
    html[lang="hi"] {
      --bootstrap-sans: "Noto Sans Devanagari Critical", "Space Grotesk Critical", ui-sans-serif, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: #f2eee5; }
    html.js #static-document { display: none; }
    #static-document {
      max-width: 72rem;
      margin: 0 auto;
      padding: 3rem clamp(1.5rem, 5vw, 5rem);
      color: #12110f;
      font: 400 1rem/1.6 var(--bootstrap-sans);
    }
    #static-document h1 { font-size: clamp(2.5rem, 7vw, 5rem); line-height: 1.05; }
    #static-document h2 { margin-top: 3rem; font-size: 2rem; }
    #static-document h3 { margin-bottom: 0.25rem; font-size: 1.2rem; }
    #static-document nav ul { display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; }
    #static-document ul { padding-left: 1.5rem; }
    #static-document li { margin: 0.75rem 0; }
    #static-document a { color: #1646d8; }
    #static-document footer { margin-top: 4rem; padding-top: 1rem; border-top: 1px solid #bbb; }
    #bootstrap-surface {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      background:
        radial-gradient(circle at 78% 18%, rgba(30, 81, 255, 0.14), transparent 34%),
        #f2eee5;
      opacity: 1;
      transition: opacity 90ms linear;
    }
    #bootstrap-surface.bootstrap-surface--done {
      pointer-events: none;
      opacity: 0;
    }
    .bootstrap-shell {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: 100%;
      height: 100%;
      min-height: 620px;
      padding: 108px 160px 62px;
      color: #12110f;
      font-family: var(--bootstrap-sans);
    }
    .bootstrap-rail {
      display: flex;
      gap: 28px;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(18, 17, 15, 0.2);
      color: #403c36;
      font: 600 13px/1.4 var(--bootstrap-sans);
    }
    .bootstrap-rail-end {
      display: flex;
      gap: 18px;
      align-items: center;
      text-align: right;
    }
    .bootstrap-stage {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 42px 0 28px;
    }
    .bootstrap-title {
      display: flex;
      flex-flow: row wrap;
      direction: ltr;
      unicode-bidi: isolate;
      gap: 0.1em;
      align-items: baseline;
      margin: 0;
      font-size: clamp(100px, 7.7vw, 132px);
      font-weight: 760;
      line-height: 0.82;
      letter-spacing: -0.05em;
      color: #12110f;
      font-family: "Space Grotesk Critical", ui-sans-serif, sans-serif;
      text-transform: uppercase;
    }
    .bootstrap-title-accent {
      padding: 0.16em 0.11em 0.08em;
      color: #fffcf4;
      background: #1e51ff;
      box-shadow: 0 -0.16em 0 #1e51ff;
      font-family: "Space Grotesk Critical", ui-sans-serif, sans-serif;
      font-size: 1em;
      font-style: normal;
      font-weight: 760;
      letter-spacing: -0.05em;
      text-transform: uppercase;
    }
    .bootstrap-footer {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.9fr);
      gap: clamp(52px, 8vw, 110px);
      align-items: end;
    }
    .bootstrap-statement-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .bootstrap-statement {
      max-width: 580px;
      margin: 0;
      color: #12110f;
      font-size: clamp(18px, 1.55vw, 22px);
      font-weight: 520;
      line-height: 1.36;
      letter-spacing: -0.02em;
    }
    .bootstrap-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }
    .bootstrap-action {
      box-sizing: border-box;
      padding: 16px 32px;
      color: #403c36;
      white-space: nowrap;
      border: 1px solid rgba(18, 17, 15, 0.24);
      font: 500 14px/1.55 var(--bootstrap-sans);
      letter-spacing: 2px;
    }
    .bootstrap-action--primary {
      color: #fffcf4;
      background: #1e51ff;
      border-color: #1e51ff;
      box-shadow: 4px 4px 0 #12110f;
    }
    .bootstrap-facts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(16px, 2vw, 28px);
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .bootstrap-fact {
      padding-top: 11px;
      border-top: 1px solid rgba(18, 17, 15, 0.24);
      color: #12110f;
      font: 600 13px/1.35 var(--bootstrap-sans);
    }
    .bootstrap-fact-label {
      display: block;
      margin-bottom: 7px;
      color: #756e64;
      font-size: 11px;
      font-weight: 400;
    }
    .bootstrap-error {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(420px, calc(100% - 48px));
      color: #12110f;
      font: 500 15px/1.6 var(--bootstrap-sans);
      text-align: center;
      transform: translate(-50%, -50%);
    }
    .bootstrap-retry {
      display: block;
      margin: 22px auto 0;
      padding: 10px 16px;
      color: #12110f;
      cursor: pointer;
      background: rgba(30, 81, 255, 0.1);
      border: 1px solid rgba(30, 81, 255, 0.72);
      font: inherit;
    }
    @media (max-width: 1400px) and (min-width: 900px) {
      .bootstrap-shell { padding-right: 80px; padding-left: 80px; }
      .bootstrap-title { font-size: clamp(72px, 9vw, 96px); }
    }
    @media (max-width: 899px) {
      .bootstrap-shell {
        min-height: 520px;
        padding: 108px 24px 62px;
      }
      .bootstrap-rail-focus { display: none; }
      .bootstrap-stage {
        padding: 40px 0 26px;
        transform: translateY(clamp(-60px, calc(94px - 18.5vw), 18px));
      }
      .bootstrap-title {
        font-size: clamp(38px, 12.5vw, 64px);
        line-height: 0.82;
      }
      .bootstrap-title-accent { align-self: auto; }
      .bootstrap-footer {
        grid-template-columns: 1fr;
        gap: 28px;
      }
      .bootstrap-statement {
        max-width: 34rem;
        font-size: 18px;
      }
      .bootstrap-fact { font-size: 11px; }
    }
    @media (max-width: 339px) {
      .bootstrap-shell { padding-top: 88px; }
      .bootstrap-stage { transform: none; }
      .bootstrap-actions {
        display: grid;
        width: 100%;
      }
      .bootstrap-action { width: 100%; text-align: center; }
    }
    @media (min-width: 600px) and (max-width: 899px) {
      .bootstrap-footer { transform: translateY(-77px); }
    }
    @media (max-height: 480px) and (orientation: landscape) {
      .bootstrap-shell {
        min-height: 0;
        padding: 22px 28px 24px;
      }
      .bootstrap-rail { padding-bottom: 8px; font-size: 10px; }
      .bootstrap-stage { padding: 10px 0; transform: none; }
      .bootstrap-title { font-size: clamp(36px, 9vw, 52px); }
      .bootstrap-footer {
        grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .bootstrap-statement { font-size: 13px; line-height: 1.25; }
      .bootstrap-actions { flex-wrap: nowrap; gap: 6px; margin-top: 8px; }
      .bootstrap-action {
        padding: 8px 12px;
        font-size: 10px;
        line-height: 1.4;
        letter-spacing: 1px;
      }
      .bootstrap-facts { gap: 8px; }
      .bootstrap-fact { padding-top: 6px; font-size: 10px; }
      .bootstrap-fact-label { margin-bottom: 3px; font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #bootstrap-surface { transition: none; }
    }
  </style>
