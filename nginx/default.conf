gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  application/json
  application/javascript
  application/wasm
  text/xml
  application/xml
  font/woff2
  font/ttf
  font/otf;

server_tokens off;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  etag on;
  # Preserve security headers in child locations.
  add_header_inherit merge;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "credentialless" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  # portfolio-csp:start
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' https://analytics.developeryusuf.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://analytics.developeryusuf.com; frame-ancestors 'self'; upgrade-insecure-requests;" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  # portfolio-csp:end

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;

  location = /.well-known/security.txt {
    default_type text/plain;
    charset utf-8;
    try_files $uri =404;
  }

  location = /resume.pdf {
    types { application/pdf pdf; }
    try_files $uri =404;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    gzip off;
    gzip_static off;
  }

  location = /resume.html {
    types { text/html html; }
    try_files $uri =404;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # Stable Flutter entrypoints use release query hashes.
  location = /main.dart.wasm {
    expires 1y;
  }

  location = /main.dart.js {
    expires 1y;
  }

  location = /main.dart.mjs {
    default_type application/javascript;
    expires 1y;
  }

  # Renderer paths carry the engine revision.
  location ~* "^/canvaskit/[0-9a-f]{40}/.*\.(js|wasm)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Serve modules with a JavaScript type and revalidate stable names.
  location ~* \.mjs$ {
    default_type application/javascript;
    expires -1;
  }

  location ~* \.(html|js|json|wasm)$ {
    expires -1;
  }

  # Revalidate content assets with stable names.
  location ~* ^/assets/.*\.ttf$ {
    default_type font/ttf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  location ~* ^/assets/.*\.otf$ {
    default_type font/otf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  location ~* ^/assets/.*\.(png|jpg|jpeg|gif|webp|ico|svg|woff2?|css)$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
  }

  # Keep renderer symbols private.
  location ~* \.symbols$ {
    return 404;
  }

  # Assign types to bundled variable fonts.
  location ~* \.ttf$ {
    default_type font/ttf;
    expires 1y;
  }

  location ~* \.otf$ {
    default_type font/otf;
    expires 1y;
  }

  location ~* \.(png|jpg|jpeg|gif|webp|ico|svg|woff2?|css)$ {
    expires 1y;
  }
}
